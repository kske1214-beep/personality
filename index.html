<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面接向け 企業分析ダッシュボード</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>面接向け 企業分析ダッシュボード</h1>
    <p>企業名・採用種別・勤務地・職種・求人票から、面接準備に必要な情報を可視化します。</p>
  </header>

  <main class="container">
    <section class="panel filters" aria-label="検索条件">
      <h2>検索条件</h2>
      <form id="searchForm">
        <label for="companyInput">1. 企業名</label>
        <input id="companyInput" type="text" placeholder="例: 株式会社サンプル" required />

        <label for="hiringType">2. 採用種別</label>
        <select id="hiringType" required>
          <option value="">選択してください</option>
          <option value="中途採用（正社員）">中途採用（正社員）</option>
          <option value="中途採用（契約社員）">中途採用（契約社員）</option>
        </select>

        <label for="location">3. 勤務地</label>
        <select id="location" required></select>

        <label for="jobType">4. 職種</label>
        <select id="jobType" required>
          <option value="">選択してください</option>
          <option value="webマーケティング">webマーケティング</option>
          <option value="デジタルマーケティング">デジタルマーケティング</option>
          <option value="webマーケティングコンサルティング">webマーケティングコンサルティング</option>
          <option value="デジタルマーケティングコンサルティング">デジタルマーケティングコンサルティング</option>
          <option value="webディレクター">webディレクター</option>
          <option value="広告運用スタッフ">広告運用スタッフ</option>
        </select>

        <label for="jobPostText">5. 求人票（コピペ）</label>
        <textarea id="jobPostText" rows="8" placeholder="求人票本文をそのまま貼り付けてください（必須）" required></textarea>

        <button type="submit">分析を表示（自動）</button>
      </form>
    </section>

    <section class="panel results" aria-live="polite">
      <h2>分析結果</h2>
      <div id="emptyState" class="empty-state">1〜5を入力して「分析を表示（自動）」をクリックしてください。</div>
      <article id="resultCard" class="hidden">
        <h3 id="resultTitle"></h3>
        <p id="resultSummary"></p>
        <div class="viz-grid">
          <section class="viz-card">
            <h4>企業の強みマップ（求人票補正後）</h4>
            <canvas id="strengthChart" width="440" height="260"></canvas>
            <p id="strengthDescription"></p>
          </section>
          <section class="viz-card">
            <h4>募集ポジションの重視項目（求人票補正後）</h4>
            <canvas id="fitChart" width="440" height="260"></canvas>
            <p id="fitDescription"></p>
          </section>
        </div>
        <section class="insight"><h4>求人票のキーワード抽出</h4><ul id="keywordList"></ul></section>
        <section class="insight"><h4>求める人材の特定（面接対策）</h4><ul id="talentList"></ul></section>
        <section class="insight"><h4>面接で使える逆質問例</h4><ul id="questionList"></ul></section>
      </article>
    </section>
  </main>

  <footer><small>※ デモ版: 入力した求人票本文のキーワード頻度から分析結果を自動補正します。</small></footer>
  <script src="app.js"></script>
</body>
</html>
